apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: lissa-fit
  labels:
    app: storage-service
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
        version: v1
      annotations:
        prometheus.io/port: "8085"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-timescaledb
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z wa-timescaledb 5432; do echo waiting for timescaledb; sleep 2; done;']
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z wa-kafka 9092; do echo waiting for kafka; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z wa-redis 6379; do echo waiting for redis; sleep 2; done;']
      containers:
        - name: storage-service
          image: mihailovpasha/storage-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              name: http
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: storage-service-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-service-secrets
                  key: DB_PASSWORD
            - name: SPRING_LIQUIBASE_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: SPRING_LIQUIBASE_DEFAULT_SCHEMA
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_RETRY_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: KAFKA_RETRY_INTERVAL_MS
            - name: KAFKA_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: KAFKA_MAX_RETRIES
            - name: SPRING_KAFKA_PROPERTIES_SPRING_JSON_USE_TYPE_HEADERS
              value: "false"
            - name: SPRING_KAFKA_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: SPRING_KAFKA_PROPERTIES_SPRING_JSON_VALUE_DEFAULT_TYPE
            - name: SPRING_KAFKA_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: SPRING_KAFKA_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: REDIS_PORT
            - name: REDIS_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: storage-service-config
                  key: REDIS_TIMEOUT
            - name: JWT_SECRET_ACCESS
              valueFrom:
                secretKeyRef:
                  name: storage-service-secrets
                  key: JWT_SECRET_ACCESS
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
